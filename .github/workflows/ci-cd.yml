name: Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# wrangler deploy has no notion of "newer": whichever run finishes last wins.
# Serialise publishes so a slow or re-run job cannot overwrite a newer deploy.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Bake Posts
        run: npm run bake-posts

      - name: Typecheck
        run: npm run lint

      - name: Typecheck Worker
        run: npx tsc --noEmit -p worker/tsconfig.json

      - name: Run Tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # Re-running an old run checks out that run's commit and would deploy a
      # stale tree. Only the current tip of main may ship.
      - name: Refuse to deploy anything but the tip of main
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "${{ github.sha }}" ]; then
            echo "Refusing to deploy ${{ github.sha }}; tip of main is $tip." >&2
            exit 1
          fi
          echo "Deploying tip of main: $tip"

      - name: Build
        run: npm run build

      # Uses the wrangler npm ci already installed, so CI deploys with the
      # version the repo pins rather than one the action picks.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
